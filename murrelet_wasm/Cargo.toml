[package]
name = "murrelet_wasm"
version = "0.1.3"
edition = "2024"

[features]
# murrelet_gpu = []

# default = ["schemars"]
# schemars = [
#   "murrelet_gpu/schemars",
#   "murrelet_draw/schemars",
#   "murrelet_livecode/schemars",
#   "murrelet_perform/schemars",
# ]

[dependencies]
anyhow = "1.0"
serde_yaml = "0.9"
wasm-bindgen = "0.2"
paste = "1"
murrelet_common = "0.1.3"
murrelet_draw = "0.1.3"
murrelet_svg = "0.1.3"
murrelet_livecode = "0.1.3"
murrelet_gui = "0.1.3"
murrelet_perform = { version = "0.1.3", features = ["for_the_web"] }
murrelet_livecode_derive = { version = "0.1.3", default-features = false } # no schemars
murrelet_gen = { workspace = true }
# murrelet_gpu = { version = "0.1.3", features = ["no_nannou"] }
# murrelet = "0.1.3"
serde = { version = "1.0.104", features = ["derive"] }
serde_json = "1.0.48"
glam = { version = "0.28.0", features = ["serde"] }
# wgpu = { version = "0.20.1", features = ["webgpu", "webgl"] }
lerpable = "0.0.3"
# anyhow = "1.0.86"
# murrelet_gen = "0.1.3"
regex = "1.7.3"


[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Window",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "SvgElement","SvgsvgElement"
]


# to write a bit more javascript we need...
[[bin]]
name = "murrelet_ship_js"
path = "src/bin/murrelet_ship_js.rs"