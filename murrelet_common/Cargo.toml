[package]
name = "murrelet_common"
version = "0.1.3"
edition = "2024"
authors = ["Jessica Stringham <jessica@thisxorthat.art>"]
repository = "https://github.com/jessstringham/murrelet.git"
description = "common functions for murrelet, a livecode framework"
license = "AGPL-3.0-or-later"

[dependencies]
itertools = { workspace = true }
glam = { version = "0.28.0", features = ["serde"] }
palette = "0.7.6"
rand = "0.8"
num-traits = "0.2.19"
lerpable = { workspace = true, features = ["glam"] }
serde = { version = "1.0.104", features = ["derive"] }
bytemuck = { version = "1.15", features = ["derive"] }
thiserror = "2.0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
getrandom = { workspace = true }
