[package]
name = "murrelet_gui"
version = "0.1.3"
edition = "2024"

[features]
default = []
glam = ["dep:glam"]
murrelet = ["dep:murrelet_common"]

[dependencies]
murrelet_gui_derive = { workspace = true }
murrelet_schema = { workspace = true }
murrelet_schema_derive = { workspace = true }
murrelet_common = { workspace = true, optional = true }  # used to derive types

thiserror = "2.0.11"
serde = { version = "1.0.104", features = ["derive"] }
serde_json = { workspace = true }
itertools = { workspace = true }

glam = { version = "0.28.0", optional = true }

[[example]]
name = "tests"
path = "examples/tests.rs"

[[example]]
name = "tests_schema"
path = "examples/tests_schema.rs"
