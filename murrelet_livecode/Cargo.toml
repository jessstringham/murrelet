[package]
name = "murrelet_livecode"
version = "0.1.3"
edition = "2024"
authors = ["Jessica Stringham <jessica@thisxorthat.art>"]
repository = "https://github.com/jessstringham/murrelet.git"
description = "livecode base functions for murrelet, a livecode framework"
license = "AGPL-3.0-or-later"

[features]
schemars = ["dep:schemars", "murrelet_livecode_derive/schemars"]

[dependencies]
murrelet_common = { workspace = true }
murrelet_gui = { workspace = true, features = ["glam"] }
murrelet_livecode_derive = { workspace = true }

lerpable = { workspace = true, features = ["glam"] }

itertools = "0.10.5"
regex = "1.7.3"
uuid = "1.8.0"
rand = "0.8"
glam = { version = "0.28.0", features = ["serde"] }
anyhow = "1.0.86"
noise = "0.9.0"
evalexpr = { version = "11.1.0", features = ["serde_support"] }
serde = { version = "1.0.104", features = ["derive"] }
serde_yaml = "0.9.17"
thiserror = "2.0.11"

schemars = { version = "0.8.21", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true }


# just for examples...
[dev-dependencies]
murrelet_common = { workspace = true }
glam = { version = "0.28.0", features = ["serde"] }
palette = "0.7.6"
lerpable = { workspace = true, features = ["glam"] }
schemars = "0.8.21"
murrelet_gui = { workspace = true, features = ["glam"] }
serde_json = "1.0"

[[example]]
name = "tests"
path = "examples/tests.rs"
